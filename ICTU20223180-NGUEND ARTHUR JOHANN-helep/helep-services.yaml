---
# HELEP Kubernetes Deployments
# Deploy all 5 microservices to the helep namespace

---
# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: helep
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: docker.io/helep/user-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: KAFKA_BOOTSTRAP
          value: "kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: DB_PATH
          value: "/data/user.db"
        - name: JWT_SECRET
          value: "demo-secret-key"
        resources:
          requests:
            memory: "128Mi"
            cpu: "80m"
          limits:
            memory: "256Mi"
            cpu: "400m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: helep
spec:
  selector:
    app: user-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

