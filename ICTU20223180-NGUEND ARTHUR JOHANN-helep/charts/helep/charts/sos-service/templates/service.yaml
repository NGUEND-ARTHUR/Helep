apiVersion: v1
kind: Service
metadata:
  name: {{ include "svc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "svc.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8002
      targetPort: 8002
