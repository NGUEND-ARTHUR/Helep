# Allow inbound HTTP on port 8003 to dispatch-service from:
#   nginx ingress controller, prometheus scraper, and other helep pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inbound-dispatch-service
  namespace: helep
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dispatch-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 8003, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 8003, protocol: TCP }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: helep
      ports:
        - { port: 8003, protocol: TCP }
