# Let our services talk to Strimzi Kafka brokers in namespace 'kafka'.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-kafka
  namespace: helep
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: helep
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - { port: 9092, protocol: TCP }
        - { port: 9093, protocol: TCP }
